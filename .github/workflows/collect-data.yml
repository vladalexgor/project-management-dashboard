name: Сбор данных (каждые 30 мин)

on:
  schedule:
    - cron: "0,30 * * * *"   # каждые 30 минут, круглосуточно
  workflow_dispatch:           # ручной запуск для теста

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Collect data from Google Sheets
        run: python scripts/collect_data.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: снапшот $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
