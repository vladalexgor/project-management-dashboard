<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление проектами — Бюро</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f6ef7;
    --accent2: #7c5ff7;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }

  #updated-at { font-size: 12px; }

  .refresh-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .refresh-btn:hover { opacity: 0.85; }

  main { max-width: 1400px; margin: 0 auto; padding: 32px; }

  /* AI Summary */
  .ai-card {
    background: linear-gradient(135deg, #1e2240 0%, #1a1d27 100%);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .ai-card h2 { font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .ai-card p { font-size: 15px; line-height: 1.7; color: var(--text); }
  .ai-meta { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* KPI Row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .kpi-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .kpi-value { font-size: 32px; font-weight: 700; line-height: 1; }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .kpi-green { color: var(--green); }
  .kpi-yellow { color: var(--yellow); }
  .kpi-red { color: var(--red); }
  .kpi-blue { color: var(--accent); }

  /* Grid 2 col */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }

  /* Employee table */
  .emp-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px 80px 100px;
    gap: 8px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .emp-row:last-child { border-bottom: none; }
  .emp-name { font-weight: 500; }
  .emp-num { text-align: center; font-variant-numeric: tabular-nums; }

  .bar-wrap { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface2); }
  .bar-done { background: var(--green); }
  .bar-wip { background: var(--accent); }
  .bar-wait { background: var(--yellow); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-overloaded { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-normal { background: rgba(34,197,94,0.12); color: var(--green); }

  /* Risk list */
  .risk-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .risk-item:last-child { border-bottom: none; }
  .risk-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .risk-title { font-weight: 500; line-height: 1.4; }
  .risk-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Project bars */
  .proj-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 13px;
  }
  .proj-name { width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-bar-wrap { flex: 1; background: var(--surface2); height: 8px; border-radius: 4px; overflow: hidden; }
  .proj-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s; }
  .proj-count { font-size: 12px; color: var(--muted); width: 30px; text-align: right; }

  /* Changes */
  .change-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .change-item:last-child { border-bottom: none; }
  .change-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .dot-done { background: var(--green); }
  .dot-new { background: var(--accent); }
  .dot-change { background: var(--yellow); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--muted);
    background: none;
  }
  .tab.active { background: var(--surface2); border-color: var(--border); color: var(--text); }

  .loading { text-align: center; color: var(--muted); padding: 60px; font-size: 14px; }
  .error-msg { background: rgba(239,68,68,0.1); border: 1px solid var(--red); border-radius: 8px; padding: 16px; color: var(--red); font-size: 13px; margin-bottom: 20px; }

  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Бюро <span>/ Проекты</span></div>
  <div class="header-right">
    <span id="updated-at">Загрузка...</span>
    <button class="refresh-btn" onclick="loadData()">↻ Обновить</button>
  </div>
</header>

<main>
  <div id="error-container"></div>
  <div id="app"><div class="loading">Загрузка данных...</div></div>
</main>

<script>
const DATA_URL = 'data/latest.json';
const REPORT_URL = 'reports/latest_report.json';

function fmt(dt) {
  if (!dt) return '—';
  const d = new Date(dt);
  return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function riskIcon(type) {
  if (type === 'overdue') return '🔴';
  if (type === 'urgent') return '🟡';
  if (type === 'blocked') return '⏸️';
  return '⚪';
}

function riskLabel(r) {
  if (r.type === 'overdue') return `Просрочено на ${r.days} дн.`;
  if (r.type === 'urgent') return `Срок через ${r.days} дн. (${r.deadline})`;
  if (r.type === 'blocked') return `Заблокировано`;
  return '';
}

function renderEmployeeTable(byEmployee) {
  const entries = Object.entries(byEmployee).sort((a, b) => b[1].total - a[1].total);
  if (!entries.length) return '<p style="color:var(--muted);font-size:13px">Нет данных</p>';

  const maxTasks = Math.max(...entries.map(([,v]) => v.total), 1);

  return `
    <div class="emp-row" style="font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding-bottom:6px">
      <div>Сотрудник</div><div class="emp-num">Всего</div>
      <div class="emp-num" style="color:var(--green)">✓</div>
      <div class="emp-num" style="color:var(--accent)">▶</div>
      <div class="emp-num" style="color:var(--yellow)">⏸</div>
    </div>
    ${entries.map(([name, v]) => {
      const total = v.total || 1;
      const doneW = Math.round((v['завершено'] || 0) / total * 100);
      const wipW = Math.round((v['в работе'] || 0) / total * 100);
      const waitW = Math.round((v['ожидание'] || 0) / total * 100);
      const overloaded = v.total >= 8;
      return `
        <div class="emp-row">
          <div>
            <div class="emp-name">${name}</div>
            <div class="bar-wrap" style="margin-top:5px">
              <div class="bar-done" style="width:${doneW}%"></div>
              <div class="bar-wip" style="width:${wipW}%"></div>
              <div class="bar-wait" style="width:${waitW}%"></div>
            </div>
          </div>
          <div class="emp-num kpi-blue">${v.total}</div>
          <div class="emp-num kpi-green">${v['завершено'] || 0}</div>
          <div class="emp-num" style="color:var(--accent)">${v['в работе'] || 0}</div>
          <div class="emp-num" style="color:var(--yellow)">${v['ожидание'] || 0}</div>
        </div>`;
    }).join('')}`;
}

function renderProjects(byProject) {
  const entries = Object.entries(byProject).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<p style="color:var(--muted);font-size:13px">Нет данных</p>';
  const max = Math.max(...entries.map(([,v]) => v), 1);
  return entries.map(([name, count]) => `
    <div class="proj-row">
      <div class="proj-name" title="${name}">${name}</div>
      <div class="proj-bar-wrap"><div class="proj-bar-fill" style="width:${Math.round(count/max*100)}%"></div></div>
      <div class="proj-count">${count}</div>
    </div>`).join('');
}

function renderRisks(risks) {
  if (!risks || !risks.length) return '<p style="color:var(--muted);font-size:13px">Рисков не выявлено ✓</p>';
  return risks.slice(0, 15).map(r => `
    <div class="risk-item">
      <div class="risk-icon">${riskIcon(r.type)}</div>
      <div>
        <div class="risk-title">${r.task || '—'}</div>
        <div class="risk-meta">${r.project} · ${r.employee} · ${riskLabel(r)}</div>
      </div>
    </div>`).join('');
}

function renderChanges(changes) {
  if (!changes || !changes.length) return '<p style="color:var(--muted);font-size:13px">Изменений за день не зафиксировано</p>';
  return changes.slice(0, 20).map(c => {
    let dot = 'dot-change', text = '';
    if (c.type === 'new_task') { dot = 'dot-new'; text = `Новая задача: <b>${c.task}</b>`; }
    else if (c.type === 'status_change') {
      if (c.to === 'завершено') dot = 'dot-done';
      text = `<b>${c.task}</b> → ${c.from} → ${c.to}`;
    }
    return `
      <div class="change-item">
        <div class="change-dot ${dot}"></div>
        <div>
          <div>${text}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${c.project} · ${c.employee}</div>
        </div>
      </div>`;
  }).join('');
}

function renderAISummary(report) {
  if (!report || !report.analysis) return '';
  const a = report.analysis;
  return `
    <div class="ai-card">
      <h2>🤖 AI-анализ на ${report.date || ''}</h2>
      <p>${a.summary || ''}</p>
      ${a.week_focus ? `<p style="margin-top:12px;color:var(--muted);font-size:14px">${a.week_focus}</p>` : ''}
      <div class="ai-meta">Сформировано в 09:00 МСК · Проанализировано снапшотов: ${report.snapshots_count || '—'}</div>
    </div>`;
}

async function loadData() {
  const errEl = document.getElementById('error-container');
  errEl.innerHTML = '';

  let data, report;
  try {
    const r1 = await fetch(DATA_URL + '?v=' + Date.now());
    if (!r1.ok) throw new Error(`Нет данных (${r1.status}). Дождитесь первого запуска GitHub Actions.`);
    data = await r1.json();
  } catch (e) {
    errEl.innerHTML = `<div class="error-msg">⚠️ ${e.message}</div>`;
    document.getElementById('app').innerHTML = `<div class="loading">Данные ещё не собраны. GitHub Actions запустится через несколько минут после добавления ANTHROPIC_API_KEY в секреты репозитория.</div>`;
    return;
  }

  try {
    const r2 = await fetch(REPORT_URL + '?v=' + Date.now());
    if (r2.ok) report = await r2.json();
  } catch (_) {}

  document.getElementById('updated-at').textContent = 'Обновлено: ' + fmt(data.timestamp);

  const stats = data.stats || {};
  const byStatus = stats.by_status || {};
  const byProject = stats.by_project || {};
  const byEmployee = stats.by_employee || {};
  const risks = data.risks || [];

  const done = byStatus['завершено'] || 0;
  const wip = byStatus['в работе'] || 0;
  const wait = byStatus['ожидание'] || 0;
  const total = data.total_tasks || 0;
  const overdue = risks.filter(r => r.type === 'overdue').length;
  const changes = report?.changes || [];

  document.getElementById('app').innerHTML = `
    ${renderAISummary(report)}

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Всего задач</div>
        <div class="kpi-value kpi-blue">${total}</div>
        <div class="kpi-sub">${Object.keys(byProject).length} проектов</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Завершено</div>
        <div class="kpi-value kpi-green">${done}</div>
        <div class="kpi-sub">${total ? Math.round(done/total*100) : 0}% от всех задач</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">В работе</div>
        <div class="kpi-value kpi-blue">${wip}</div>
        <div class="kpi-sub">${wait} задач заблокировано</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Просрочено</div>
        <div class="kpi-value ${overdue > 0 ? 'kpi-red' : 'kpi-green'}">${overdue}</div>
        <div class="kpi-sub">${risks.filter(r=>r.type==='urgent').length} срочных задач</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Загрузка сотрудников</h3>
        ${renderEmployeeTable(byEmployee)}
      </div>
      <div class="card">
        <h3>Риски и дедлайны</h3>
        ${renderRisks(risks)}
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>Задачи по проектам</h3>
        ${renderProjects(byProject)}
      </div>
      <div class="card">
        <h3>Изменения за 24 часа</h3>
        ${renderChanges(changes)}
      </div>
    </div>

    ${report?.analysis?.risks?.length ? `
    <div class="card" style="margin-bottom:24px">
      <h3>Рекомендации AI</h3>
      ${report.analysis.risks.map(r => `
        <div class="risk-item">
          <div class="risk-icon">${r.severity === 'high' ? '🔴' : '🟡'}</div>
          <div>
            <div class="risk-title">${r.description}</div>
            <div class="risk-meta">→ ${r.recommendation}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}
  `;
}

// Автообновление каждые 30 минут
loadData();
setInterval(loadData, 30 * 60 * 1000);
</script>
</body>
</html>
